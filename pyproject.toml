[project]
name = "agent-harness-ops-assistant"
version = "0.1.0"
description = "Agent harness for an operations assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "langgraph-checkpoint-mongodb>=0.1",
    "pymongo>=4.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "structlog>=24.4",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real OpenAI API (needs OPENAI_API_KEY)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
